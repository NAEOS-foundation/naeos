<text x="78" y="365" fill="#60A5FA" font-family="Sora, sans-serif" font-size="92" font-weight="600">“</text>
<text x="78" y="475" fill="#FFFFFF" font-family="Sora, sans-serif" font-size="58" font-weight="600" letter-spacing="-1.5">TRUST IS NOT A FEATURE.</text>
<text x="78" y="555" fill="#FFFFFF" font-family="Sora, sans-serif" font-size="58" font-weight="600" letter-spacing="-1.5">IT IS AN ENGINEERING</text>
<text x="78" y="635" fill="#60A5FA" font-family="Sora, sans-serif" font-size="58" font-weight="600" letter-spacing="-1.5">OUTCOME.</text>
<text x="78" y="745" fill="#E5E7EB" font-family="Inter, sans-serif" font-size="24">Control what is allowed. Verify what happens.</text>
<text x="78" y="781" fill="#E5E7EB" font-family="Inter, sans-serif" font-size="24">Preserve evidence of every meaningful outcome.</text>
