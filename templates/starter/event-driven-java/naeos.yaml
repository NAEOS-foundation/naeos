project:
  name: event-driven-java
  version: "1.0.0"
  modules:
    - name: producer
      path: ./src/producer
    - name: consumer
      path: ./src/consumer
  services:
    - name: producer
      port: 8080
      kind: http
    - name: consumer
      port: 8081
      kind: http
  architecture:
    pattern: event-driven
