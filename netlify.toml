[build]
  base    = "site/"
  publish = "public"
  command = "hugo --minify"

[build.environment]
  HUGO_VERSION = "0.145.0"
  HUGO_EXTENDED = "true"

[context.production]
  environment = { HUGO_ENV = "production" }

[context.deploy-preview]
  environment = { HUGO_ENV = "production" }

[context.branch-deploy]
  environment = { HUGO_ENV = "production" }

[[redirects]]
  from = "https://naeos.dev/*"
  to = "https://docs.naeos.dev/:splat"
  status = 301
