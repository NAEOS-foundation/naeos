[feature_pipeline]
other = "Pipeline Engine"

[feature_pipeline_desc]
other = "Pipeline DAG 11-tahap dari spesifikasi ke kode siap kirim. Setiap tahap dapat diamati, di-cache, dan diperluas dengan plugin. Inspeksi setiap transformasi dari YAML ke artifak."

[feature_compiler]
other = "Kompiler AI"

[feature_compiler_desc]
other = "Umpankan arsitektur Anda langsung ke asisten pemrograman. Bundel konteks AI memberikan kesadaran sistem penuh kepada Copilot, Claude, Cursor, Gemini, Codex, dan OpenCode — tanpa prompt berulang."

[feature_generator]
other = "Generator Kode"

[feature_generator_desc]
other = "Kode siap-produksi dalam Go, TypeScript, Python, Java, dan Rust. Adapter per-bahasa menghasilkan struktur proyek idiomatis, pengujian, dan file dependensi langsung jadi."

[feature_neir]
other = "Model NEIR"

[feature_neir_desc]
other = "Model kanonikal dari seluruh sistem Anda — struktur proyek, arsitektur, modul, layanan, API, infrastruktur, dan kebijakan keamanan. NEIR adalah jembatan antara niat Anda dan setiap artifak yang dihasilkan."

[feature_governance]
other = "Tata Kelola & Kebijakan"

[feature_governance_desc]
other = "Terapkan aturan arsitektur sebelum masuk produksi. Mesin kebijakan dengan 7 operator, RBAC, jejak audit penuh, dan tinjauan artefak. Deteksi pelanggaran saat generasi, bukan saat deployment."

[feature_marketplace]
other = "Marketplace"

[feature_marketplace_desc]
other = "Publikasikan, temukan, dan pasang profil industri serta plugin. 5 profil bawaan (SaaS, AI Agent, FinTech, Healthcare, Government) plus registry komunitas yang terus berkembang."

