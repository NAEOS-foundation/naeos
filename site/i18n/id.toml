[hero_title]
other = "Tentukan Sekali.<br>Hasilkan Semuanya."

[hero_subtitle]
other = "Dari satu spesifikasi YAML, NAEOS menghasilkan proyek lengkap — kode, CI/CD, dokumentasi, manifes deployment, dan konteks AI — dalam 5 bahasa dan 6 platform AI. Berhenti scaffolding. Mulai shipping."

[section_what_is]
other = "Cetak Biru Anda, Terotomatisasi"

[section_what_is_desc]
other = "NAEOS adalah runtime rekayasa yang membaca spesifikasi YAML/JSON Anda, membangun model internal lengkap sistem Anda (NEIR), lalu mengorkestrasi seluruh siklus hidup rekayasa — parse, validasi, hasilkan, kompilasi, dan ekspor. Spesifikasi Anda tetap menjadi sumber kebenaran tunggal dari prototipe pertama hingga produksi."

