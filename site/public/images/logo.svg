<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">NAEOS — Nusantara AI Engineering Operating System</title>
  <desc id="desc">Glossy dimensional infinity N ribbon emblem with cyan, blue, violet and magenta gradients and NAEOS wordmark.</desc>
  <defs>
    <linearGradient id="ribbon-main" x1="8%" y1="8%" x2="92%" y2="92%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="24%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="76%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#D946EF"/>
    </linearGradient>
    <linearGradient id="ribbon-side" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891B2"/>
      <stop offset="44%" stop-color="#1D4ED8"/>
      <stop offset="78%" stop-color="#6D28D9"/>
      <stop offset="100%" stop-color="#A21CAF"/>
    </linearGradient>
    <linearGradient id="ribbon-gloss" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity=".78"/>
      <stop offset="38%" stop-color="#E0F2FE" stop-opacity=".42"/>
      <stop offset="72%" stop-color="#C4B5FD" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity=".48"/>
    </linearGradient>
    <linearGradient id="edge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E7490"/>
      <stop offset="50%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#7E22CE"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#0F172A" flood-opacity=".22"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Soft reflected glow -->
  <ellipse cx="270" cy="335" rx="175" ry="22" fill="#2563EB" opacity=".12" filter="url(#glow)"/>

  <!-- Dimensional interlocking infinity/N emblem -->
  <g transform="translate(55 35)" filter="url(#shadow)">
    <!-- lower/deep ribbon body -->
    <path d="M108 181
      C108 94 181 45 252 45
      C294 45 331 61 365 95
      L468 198
      C499 229 548 211 548 160
      C548 110 500 91 468 123
      L425 166"
      fill="none" stroke="url(#edge)" stroke-width="94"
      stroke-linecap="round" stroke-linejoin="round"/>

    <!-- main ribbon -->
    <path d="M548 181
      C548 94 475 45 404 45
      C362 45 325 61 291 95
      L188 198
      C157 229 108 211 108 160
      C108 110 156 91 188 123
      L231 166"
      fill="none" stroke="url(#ribbon-main)" stroke-width="94"
      stroke-linecap="round" stroke-linejoin="round"/>

    <!-- raised glossy planes -->
    <path d="M124 154
      C130 93 182 67 248 67
      C284 67 315 78 344 107"
      fill="none" stroke="url(#ribbon-gloss)" stroke-width="25"
      stroke-linecap="round" opacity=".92"/>

    <path d="M532 154
      C526 93 474 67 408 67
      C372 67 341 78 312 107"
      fill="none" stroke="url(#ribbon-gloss)" stroke-width="25"
      stroke-linecap="round" opacity=".88"/>

    <!-- inner edge shading creates folded-ribbon depth -->
    <path d="M283 111 L347 175"
      fill="none" stroke="#123EAB" stroke-width="30"
      stroke-linecap="round" opacity=".42"/>
    <path d="M313 111 L377 175"
      fill="none" stroke="#8B5CF6" stroke-width="17"
      stroke-linecap="round" opacity=".36"/>

    <!-- sharp specular accents -->
    <path d="M145 105 C171 73 207 64 246 65"
      fill="none" stroke="#FFFFFF" stroke-width="7"
      stroke-linecap="round" opacity=".72"/>
    <path d="M511 105 C485 73 449 64 410 65"
      fill="none" stroke="#FFFFFF" stroke-width="7"
      stroke-linecap="round" opacity=".64"/>
  </g>

  <!-- NAEOS wordmark -->
  <g transform="translate(665 112)" fill="url(#wordmark)">
    <text x="0" y="92"
      font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
      font-size="108" font-weight="800" letter-spacing="8">NAEOS</text>
    <text x="7" y="148"
      font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
      font-size="21" font-weight="700" letter-spacing="5.2">NUSANTARA AI ENGINEERING</text>
    <text x="7" y="182"
      font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
      font-size="21" font-weight="700" letter-spacing="5.2">OPERATING SYSTEM</text>
  </g>
</svg>
