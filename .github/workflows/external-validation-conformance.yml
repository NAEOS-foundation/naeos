name: External Validation — Conformance 002

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/external-validation-conformance.yml'
      - 'scripts/external_validation_conformance.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    name: Mutation + freshness + recovery conformance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NAEOS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Run NAEOS conformance harness
        run: |
          set -euo pipefail
          mkdir -p external-validation-evidence
          python scripts/external_validation_conformance.py \
            --output external-validation-evidence/conformance.json

      - name: Checkout Attenu source
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/attenu-io/attenu-guard.git /tmp/attenu-guard
          cd /tmp/attenu-guard
          git rev-parse HEAD > "$GITHUB_WORKSPACE/external-validation-evidence/attenu_commit.txt"

      - name: Install external runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e /tmp/attenu-guard
          python -m pip install 'crewai==1.15.16' 'cryptography'

      - name: Run external CrewAI + Attenu baseline
        working-directory: /tmp/attenu-guard
        run: |
          set -o pipefail
          python examples/integrations/crewai/demo.py 2>&1 | tee "$GITHUB_WORKSPACE/external-validation-evidence/crewai-attenu-demo.log"

      - name: Capture validation record
        if: always()
        run: |
          set -euo pipefail
          {
            echo "NAEOS commit: $GITHUB_SHA"
            echo "Attenu commit: $(cat external-validation-evidence/attenu_commit.txt 2>/dev/null || echo unavailable)"
            echo "CrewAI: 1.15.16"
            echo "Python: 3.12"
            echo
            echo "Conformance boundary:"
            echo "- mutation-after-authorization: canonical invocation binding must reject changed arguments"
            echo "- policy v1 -> v2 freshness: authorization bound to v1 must not execute under v2"
            echo "- crash/recovery: one logical invocation must retain one execution/evidence chain across worker restart"
            echo
            echo "Important: the Python harness is a deterministic conformance model, not proof of a specific third-party runtime implementation."
            echo "The CrewAI + Attenu step is retained as independent external runtime evidence."
          } > external-validation-evidence/validation-record.txt

      - name: Upload conformance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: external-validation-conformance-${{ github.sha }}
          path: external-validation-evidence/
          if-no-files-found: error
          retention-days: 30
