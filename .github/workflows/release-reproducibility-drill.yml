name: Release Reproducibility Drill

on:
  pull_request:
    paths:
      - "scripts/test-release-reproducibility-drill.sh"
      - "scripts/check-release-dco.sh"
      - "scripts/generate-legal-evidence.sh"
      - "scripts/validate-legal-evidence.sh"
      - "scripts/release-legal-gate.sh"
      - ".github/workflows/release-reproducibility-drill.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-reproducibility:
    name: Release reproducibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Run reproducibility drill
        run: bash scripts/test-release-reproducibility-drill.sh
