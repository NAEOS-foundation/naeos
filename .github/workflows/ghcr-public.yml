name: Make GHCR Package Public
on:
  workflow_dispatch:

permissions:
  packages: write
  contents: read

jobs:
  publicize:
    runs-on: ubuntu-latest
    steps:
      - name: Set container package visibility to public
        run: |
          RESP=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/orgs/NAEOS-foundation/packages/container/naeos \
            -d '{"visibility":"public"}')
          echo "HTTP $RESP"
          cat /tmp/resp.json
          [ "$RESP" = "200" ] || exit 1