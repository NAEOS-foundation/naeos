name: Social Media Kit Render QA
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "brand/marketing/social-media/**"
      - "scripts/render-social-media-kit.py"
      - ".github/workflows/social-media-render.yml"
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install rendering dependencies
        run: python -m pip install --disable-pip-version-check cairosvg pillow
      - name: Render SVG templates and contact sheet
        run: python scripts/render-social-media-kit.py
      - name: Upload render QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: naeos-social-media-kit-render-qa
          path: |
            brand/marketing/social-media/previews/*.png
            brand/marketing/social-media/previews/render-manifest.json
            brand/marketing/social-media/SOCIAL-MEDIA-KIT-PREVIEW.png
          if-no-files-found: error
          retention-days: 14
