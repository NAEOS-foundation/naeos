name: External Validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-validation-main
  cancel-in-progress: true

jobs:
  validate:
    name: Independent External Validation Record
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Execute external validation
        env:
          NAEOS_VALIDATION_REVIEWER: github-actions/${{ github.run_id }}
        run: bash scripts/external-validation.sh
      - name: Publish validation summary
        if: always()
        run: |
          if [[ -f "${RUNNER_TEMP}/naeos-external-validation/external-validation-record.json" ]]; then
            cat "${RUNNER_TEMP}/naeos-external-validation/external-validation-record.json" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "External validation record was not produced." >> "${GITHUB_STEP_SUMMARY}"
          fi
      - name: Upload external validation record
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: external-validation-record-${{ github.sha }}
          path: ${{ runner.temp }}/naeos-external-validation/
          if-no-files-found: error
