name: Generate PDF Documentation

on:
  push:
    branches: [main]
    paths:
      - 'site/content/docs/*.md'
      - 'WHITEPAPER*.md'
      - 'site/content/whitepaper.md'
      - 'site/content/id/whitepaper.md'
      - 'scripts/whitepaper-pdf.sh'
      - 'scripts/puppeteer-config.json'
      - '.github/workflows/pdf-docs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pdf-docs
  cancel-in-progress: true

jobs:
  generate-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Sync OpenAPI spec
        run: cp docs/openapi.yaml site/public/openapi.yaml

      - name: Setup Pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc texlive-xetex texlive-latex-base texlive-latex-recommended texlive-fonts-recommended texlive-latex-extra

      - name: Generate CLI Reference PDF
        run: |
          pandoc site/content/docs/cli-reference.md \
            --pdf-engine=xelatex \
            -V geometry:margin=1in \
            -V title="NAEOS CLI Reference" \
            -V subtitle="Version $(cat VERSION)" \
            -V author="NAEOS Foundation" \
            -V date="$(date +%Y-%m-%d)" \
            -o site/public/downloads/naeos-cli-reference.pdf

      - name: Generate Getting Started PDF
        run: |
          pandoc site/content/docs/getting-started.md \
            --pdf-engine=xelatex \
            -V geometry:margin=1in \
            -V title="NAEOS Getting Started" \
            -V subtitle="Version $(cat VERSION)" \
            -V author="NAEOS Foundation" \
            -V date="$(date +%Y-%m-%d)" \
            -o site/public/downloads/naeos-getting-started.pdf

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Validate mermaid diagrams
        run: |
          mkdir -p /tmp/mmcheck && cd /tmp/mmcheck && npm init -y >/dev/null
          npm install --prefix /tmp/mmcheck mermaid@11 jsdom
          node "$GITHUB_WORKSPACE/scripts/check-mermaid.mjs" "$GITHUB_WORKSPACE/WHITEPAPER.md" "$GITHUB_WORKSPACE/WHITEPAPER-EN.md"

      - name: Install mermaid-cli
        run: npm install -g @mermaid-js/mermaid-cli

      - name: Generate Whitepaper PDF (EN)
        run: |
          bash scripts/whitepaper-pdf.sh \
            WHITEPAPER-EN.md \
            site/public/downloads/naeos-whitepaper.pdf \
            "NAEOS Whitepaper"

      - name: Generate Whitepaper PDF (ID)
        run: |
          bash scripts/whitepaper-pdf.sh \
            WHITEPAPER.md \
            site/public/downloads/naeos-whitepaper-id.pdf \
            "Whitepaper NAEOS"

      - name: Verify PDFs generated
        run: |
          ls -la site/public/downloads/*.pdf
          test -s site/public/downloads/naeos-whitepaper.pdf
          test -s site/public/downloads/naeos-whitepaper-id.pdf
          test -s site/public/downloads/naeos-cli-reference.pdf
          test -s site/public/downloads/naeos-getting-started.pdf

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/public/downloads/*.pdf site/public/openapi.yaml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: regenerate PDF documentation and openapi spec"
            git push
          fi
