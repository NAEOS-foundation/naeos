name: Website

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/website.yml'
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts --legacy-peer-deps
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npx opennextjs-cloudflare build
      - name: Debug build output
        if: always()
        run: find . -name ".open-next" -type d 2>/dev/null; ls -la .open-next/ 2>/dev/null || echo "No .open-next in site/"; ls -la ../.open-next/ 2>/dev/null || echo "No .open-next in root"
      - name: Deploy to Cloudflare
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          command: pages deploy .open-next/assets --project-name=naeos-docs --commit-dirty=true
