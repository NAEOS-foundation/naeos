name: Website

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/openapi.yaml'
      - '.github/workflows/website.yml'
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/openapi.yaml'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - name: Sync OpenAPI spec
        run: cp ../docs/openapi.yaml static/openapi.yaml
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Generate static API docs from OpenAPI spec
        run: |
          npm install -g redoc-cli 2>&1 | tail -3
          mkdir -p static/docs/api
          redoc-cli bundle ../docs/openapi.yaml \
            -o static/docs/api/index.html \
            --title "NAEOS API Reference" \
            --options.sortPropsAlphabetically \
            --options.hideDownloadButton=false \
            --options.theme.colors.primary.main="#08d6ff" 2>&1 | tail -5
          # Create Hugo content page that includes the generated HTML
          cat > content/docs/api/_index.md << 'EOF'
          ---
          title: API Reference
          description: Statically generated API documentation from the OpenAPI specification
          weight: 17
          ---

          {{< api-docs >}}
          EOF
      - name: Generate OG images
        run: |
          npm ci 2>&1 | tail -3
          node scripts/og.mjs
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.145.0'
          extended: false
      - name: Build
        run: hugo --minify --baseURL https://naeos-foundation.github.io/naeos/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/public

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
