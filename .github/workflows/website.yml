name: Website

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/website.yml'
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts --legacy-peer-deps
      - name: Typecheck
        run: npm run typecheck
      - name: Verify social policy gate
        run: node --test --experimental-strip-types app/api/social/draft/policy.test.ts
      - name: Verify authorization contract
        run: node --test --experimental-strip-types app/api/social/draft/authorization.test.ts
      - name: Build
        run: npx opennextjs-cloudflare build
      - name: Populate static assets cache
        run: npx opennextjs-cloudflare populateCache local
      - name: Archive OpenNext build
        run: tar -czf ../naeos-site-opennext.tar.gz -C .open-next .
      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: naeos-site-opennext
          # Archive OpenNext build into a tarball so upload-artifact does not
          # skip the hidden .open-next/ (dot) directory.
          path: naeos-site-opennext.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Ensure newsletter KV namespace
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # If the token lacks KV permissions this step self-heals (warns, not fails).
          # Extract ids with grep: wrangler may prefix stdout with a telemetry
          # banner, which breaks jq's strict JSON parse.
          ID=$(npx wrangler kv namespace list 2>/dev/null | grep -oE '"[a-f0-9]{32}"' | head -n1 | tr -d '"' || true)
          if [ -z "$ID" ]; then
            ID=$(npx wrangler kv namespace create NEWSLETTER_KV 2>/dev/null | grep -oE '"[a-f0-9]{32}"' | head -n1 | tr -d '"' || true)
          fi
          if [ -n "$ID" ]; then
            jq --arg id "$ID" '.kv_namespaces = [{ "binding": "NEWSLETTER_KV", "id": $id }]'               < wrangler.jsonc > wrangler.jsonc.tmp
            mv wrangler.jsonc.tmp wrangler.jsonc
            echo "Newsletter KV namespace bound: $ID"
          else
            echo "::warning::Could not resolve or create NEWSLETTER_KV namespace; deploying without it."
          fi
      - name: Deploy to Cloudflare Workers
        # Production deploys run only from the protected main branch.
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          command: deploy
