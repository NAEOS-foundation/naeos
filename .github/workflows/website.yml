name: Website

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/website.yml'
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts --legacy-peer-deps
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npx opennextjs-cloudflare build
      - name: Populate static assets cache
        run: npx opennextjs-cloudflare populateCache local
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: naeos-site-opennext
          # .open-next is a hidden (dot) directory; upload-artifact skips hidden
          # paths unless include-hidden-files is set, which made the step find
          # "no files" and abort the job before the deploy step. Path is
          # relative to GITHUB_WORKSPACE, so the site/ prefix is required.
          path: site/.open-next/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Ensure newsletter KV namespace
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # If the token lacks KV permissions this step self-heals (warns, not fails).
          ID=$(npx wrangler kv namespace list 2>/dev/null | jq -r '.[] | select(.title == "NEWSLETTER_KV") | .id' | head -n1 || true)
          if [ -z "$ID" ]; then
            ID=$(npx wrangler kv namespace create NEWSLETTER_KV 2>/dev/null | grep -oE '"[a-f0-9]{32}"' | head -n1 | tr -d '"' || true)
          fi
          if [ -n "$ID" ]; then
            jq --arg id "$ID" '.kv_namespaces = [{ "binding": "NEWSLETTER_KV", "id": $id }]' \
              < wrangler.jsonc > wrangler.jsonc.tmp
            mv wrangler.jsonc.tmp wrangler.jsonc
            echo "Newsletter KV namespace bound: $ID"
          else
            echo "::warning::Could not resolve or create NEWSLETTER_KV namespace; deploying without it."
          fi
      - name: Deploy to Cloudflare Workers
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          command: deploy
