name: Cloudflare Deployment Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  checks: read

concurrency:
  group: cloudflare-deployment-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deployment-gate:
    name: Cloudflare Deployment Gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Determine deployment checks required by changed paths
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename')
          require_pages=false
          require_workers=false
          for file in "${changed[@]}"; do
            case "${file}" in
              site/*|.github/workflows/website.yml)
                require_pages=true
                ;;
              infra/ws-worker/*|.github/workflows/ws-deploy.yml)
                require_workers=true
                ;;
            esac
          done
          {
            echo "require_pages=${require_pages}"
            echo "require_workers=${require_workers}"
          } >> "$GITHUB_OUTPUT"
          echo "Cloudflare Pages required: ${require_pages}"
          echo "Workers Builds required: ${require_workers}"
          if [[ "${require_pages}" == false && "${require_workers}" == false ]]; then
            echo "NOT APPLICABLE: this pull request does not modify a Cloudflare deployment surface."
          fi

      - name: Wait for Cloudflare Pages preview
        if: steps.scope.outputs.require_pages == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHECK_NAME: Cloudflare Pages
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            result="$(gh api "repos/${GH_REPO}/commits/${HEAD_SHA}/check-runs?per_page=100" --jq '[.check_runs[] | select(.name == env.CHECK_NAME)] | sort_by(.started_at // .created_at) | last // {} | [.status // "missing", .conclusion // ""] | @tsv')"
            status="$(cut -f1 <<< "$result")"
            conclusion="$(cut -f2 <<< "$result")"
            echo "Cloudflare Pages: status=${status}, conclusion=${conclusion} (attempt ${attempt}/60)"
            if [[ "${status}" == completed ]]; then
              [[ "${conclusion}" == success ]] || { echo "::error::Cloudflare Pages did not succeed."; exit 1; }
              exit 0
            fi
            sleep 30
          done
          echo "::error::Timed out waiting for the Cloudflare Pages check on ${HEAD_SHA}."
          exit 1

      - name: Wait for Cloudflare Workers build
        if: steps.scope.outputs.require_workers == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHECK_NAME: 'Workers Builds: naeos'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            result="$(gh api "repos/${GH_REPO}/commits/${HEAD_SHA}/check-runs" --jq '[.check_runs[] | select(.name == env.CHECK_NAME)] | sort_by(.started_at // .created_at) | last // {} | [.status // "missing", .conclusion // ""] | @tsv')"
            status="$(cut -f1 <<< "$result")"
            conclusion="$(cut -f2 <<< "$result")"
            echo "Workers Builds: naeos: status=${status}, conclusion=${conclusion} (attempt ${attempt}/60)"
            if [[ "${status}" == completed ]]; then
              [[ "${conclusion}" == success ]] || { echo "::error::Workers Builds: naeos did not succeed."; exit 1; }
              exit 0
            fi
            sleep 30
          done
          echo "::error::Timed out waiting for Workers Builds: naeos on ${HEAD_SHA}."
          exit 1
