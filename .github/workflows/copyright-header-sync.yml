name: copyright-header-sync

on:
  push:
    branches:
      - chore/copyright-header-sync-2025

permissions:
  contents: write

jobs:
  sync:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize copyright headers
        shell: bash
        run: |
          set -euo pipefail
          files="$(git grep -Il -e 'Copyright 2024-2026 NAEOS Foundation' -e 'Copyright 2025-2026 NAEOS contributors' -- ':!.github/workflows/copyright-header-sync.yml' || true)"
          if [ -n "$files" ]; then
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              sed -i \
                -e 's/Copyright 2024-2026 NAEOS Foundation/Copyright 2025 NAEOS contributors/g' \
                -e 's/Copyright 2025-2026 NAEOS contributors/Copyright 2025 NAEOS contributors/g' \
                "$file"
            done <<< "$files"
          fi

          if git grep -n -e 'Copyright 2024-2026 NAEOS Foundation' -e 'Copyright 2025-2026 NAEOS contributors' -- ':!.github/workflows/copyright-header-sync.yml'; then
            echo "Old copyright headers remain."
            exit 1
          fi

          git diff --check
          git diff --stat

      - name: Commit synchronized headers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "NAEOS OSS"
          git config user.email "opensource@naeos.dev"
          git add -A
          git status --short
          git commit -s -m "chore: synchronize copyright headers" || exit 0
          git push origin HEAD:${{ github.ref_name }}
