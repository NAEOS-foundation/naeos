name: Runtime Bridge Lifecycle Validation

on:
  pull_request:
    paths:
      - "cmd/naeos/runtime_bridge_*.go"
      - "internal/evidence/durable_runtime_event_ledger*.go"
      - ".github/workflows/runtime-bridge-lifecycle-validation.yml"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cmd/naeos/runtime_bridge_*.go"
      - "internal/evidence/durable_runtime_event_ledger*.go"
      - ".github/workflows/runtime-bridge-lifecycle-validation.yml"

permissions:
  contents: read

concurrency:
  group: runtime-bridge-lifecycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lifecycle:
    name: Clean-checkout authenticated bridge lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify Go toolchain and build CLI
        run: |
          go version
          go build -o "${RUNNER_TEMP}/naeos" ./cmd/naeos
      - name: Run authenticated durable bridge lifecycle tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/runtime-bridge-validation"
          go test -count=1 -v ./cmd/naeos \
            -run '^(TestRuntimeBridgeAuthenticatedDurableEvidenceLifecycle|TestRuntimeBridgeEvidenceRecoveryRejectsOrphanAndMissingRecords|TestRuntimeBridgeSideEffectPersistsWhenEvidencePersistenceFails|TestRuntimeBridgeGatewayRejectsReplayBeforeSecondWrite)$' \
            2>&1 | tee "${RUNNER_TEMP}/runtime-bridge-validation/runtime-bridge-tests.log"
      - name: Publish validation scope
        if: always()
        run: |
          {
            echo "## Runtime bridge lifecycle validation"
            echo
            echo "- Clean checkout and standalone CLI build."
            echo "- Authenticated signed evidence verified against a separately generated trusted Ed25519 public key."
            echo "- Durable ledger/evidence reconciliation and signed receipt verification after command completion."
            echo "- Tampered, orphaned, and missing evidence rejection."
            echo "- Replay denial and side-effect persistence behavior when evidence persistence fails."
            echo
            echo "This is automated integration evidence, not an independent human review or production durability certification."
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload runtime bridge test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-bridge-lifecycle-${{ github.sha }}
          path: ${{ runner.temp }}/runtime-bridge-validation/
          if-no-files-found: warn
