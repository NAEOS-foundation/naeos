name: Q&A Dataset Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "tests/fixtures/qa-golden-v1.json"
      - "scripts/validate-qa-dataset.mjs"
      - ".github/workflows/qa-dataset-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-qa-dataset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Validate Q&A dataset and source references
        run: node scripts/validate-qa-dataset.mjs
