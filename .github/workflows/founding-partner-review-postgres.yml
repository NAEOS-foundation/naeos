name: Founding Partner Review PostgreSQL Security Tests

on:
  pull_request:
    branches: [feat/founding-partner-intake-20261125]
    paths:
      - '.github/workflows/founding-partner-review-postgres.yml'
      - 'supabase/migrations/20261125064126_founding_partner_intake_private_schema.sql'
      - 'supabase/migrations/20261125073000_founding_partner_private_submit_rpc.sql'
      - 'supabase/migrations/20261125100000_founding_partner_review_workflow.sql'
      - 'supabase/tests/founding_partner_review_workflow.sql'
      - 'site/app/[lang]/founding-partners/review/page.tsx'
      - 'site/components/partners/FoundingPartnerReviewDashboard.tsx'
      - 'site/.env.example'
      - 'site/FOUNDING_PARTNER_REVIEW.md'
  push:
    branches: [feat/founding-partner-review-workflow]
    paths:
      - '.github/workflows/founding-partner-review-postgres.yml'
      - 'supabase/migrations/20261125064126_founding_partner_intake_private_schema.sql'
      - 'supabase/migrations/20261125073000_founding_partner_private_submit_rpc.sql'
      - 'supabase/migrations/20261125100000_founding_partner_review_workflow.sql'
      - 'supabase/tests/founding_partner_review_workflow.sql'

permissions:
  contents: read

concurrency:
  group: founding-partner-review-postgres-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review-workflow-security:
    name: Founding Partner Review PostgreSQL Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Create isolated Supabase-compatible PostgreSQL test database
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql "postgres://postgres@localhost:5432/postgres?sslmode=disable" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE DATABASE founding_partner_review_test;
          SQL
          db="postgres://postgres@localhost:5432/founding_partner_review_test?sslmode=disable"
          psql "$db" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id uuid PRIMARY KEY);
          CREATE FUNCTION auth.uid() RETURNS uuid
            LANGUAGE sql STABLE
            AS $$
              SELECT NULLIF(current_setting('request.jwt.claim.sub', true), '')::uuid
            $$;
          GRANT USAGE ON SCHEMA auth TO authenticated;
          GRANT EXECUTE ON FUNCTION auth.uid() TO authenticated;
          SQL
      - name: Apply founding partner intake and review migrations
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          db="postgres://postgres@localhost:5432/founding_partner_review_test?sslmode=disable"
          psql "$db" -v ON_ERROR_STOP=1 -f supabase/migrations/20261125064126_founding_partner_intake_private_schema.sql
          psql "$db" -v ON_ERROR_STOP=1 -f supabase/migrations/20261125073000_founding_partner_private_submit_rpc.sql
          psql "$db" -v ON_ERROR_STOP=1 -f supabase/migrations/20261125100000_founding_partner_review_workflow.sql
      - name: Run reviewer authorization, RLS, RPC, and audit regression tests
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          db="postgres://postgres@localhost:5432/founding_partner_review_test?sslmode=disable"
          psql "$db" -v ON_ERROR_STOP=1 -f supabase/tests/founding_partner_review_workflow.sql
