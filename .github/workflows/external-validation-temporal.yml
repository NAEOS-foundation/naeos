name: External Validation — Temporal Crash Recovery 003

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/external-validation-temporal.yml'
      - 'scripts/external_validation_temporal.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  temporal-crash-recovery:
    name: Real Temporal worker crash/recovery evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout NAEOS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install Temporal SDK
        run: python -m pip install temporalio

      - name: Install Temporal CLI
        run: |
          curl -sSf https://temporal.download/cli.sh | sh
          echo "$HOME/.temporalio/bin" >> "$GITHUB_PATH"

      - name: Start local Temporal server
        run: temporal server start-dev --headless --ip 127.0.0.1 > /tmp/temporal.log 2>&1 &

      - name: Run crash/recovery experiment
        run: |
          set -o pipefail
          mkdir -p external-validation-evidence
          python scripts/external_validation_temporal.py 2>&1 | tee external-validation-evidence/temporal-crash-recovery.log

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-validation-temporal-crash-recovery-${{ github.sha }}
          path: |
            external-validation-evidence/
            /tmp/temporal.log
          if-no-files-found: error
          retention-days: 30
