name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build linux/amd64
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          go build -ldflags="-s -w -X github.com/NAEOS-foundation/naeos/internal/version.Version=${{ steps.version.outputs.VERSION }} -X github.com/NAEOS-foundation/naeos/internal/version.GitCommit=${{ github.sha }}" \
            -o naeos-linux-amd64 ./cmd/naeos

      - name: Build linux/arm64
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: |
          go build -ldflags="-s -w -X github.com/NAEOS-foundation/naeos/internal/version.Version=${{ steps.version.outputs.VERSION }} -X github.com/NAEOS-foundation/naeos/internal/version.GitCommit=${{ github.sha }}" \
            -o naeos-linux-arm64 ./cmd/naeos

      - name: Build darwin/amd64
        env:
          GOOS: darwin
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          go build -ldflags="-s -w -X github.com/NAEOS-foundation/naeos/internal/version.Version=${{ steps.version.outputs.VERSION }} -X github.com/NAEOS-foundation/naeos/internal/version.GitCommit=${{ github.sha }}" \
            -o naeos-darwin-amd64 ./cmd/naeos

      - name: Build darwin/arm64
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: |
          go build -ldflags="-s -w -X github.com/NAEOS-foundation/naeos/internal/version.Version=${{ steps.version.outputs.VERSION }} -X github.com/NAEOS-foundation/naeos/internal/version.GitCommit=${{ github.sha }}" \
            -o naeos-darwin-arm64 ./cmd/naeos

      - name: Build windows/amd64
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          go build -ldflags="-s -w -X github.com/NAEOS-foundation/naeos/internal/version.Version=${{ steps.version.outputs.VERSION }} -X github.com/NAEOS-foundation/naeos/internal/version.GitCommit=${{ github.sha }}" \
            -o naeos-windows-amd64.exe ./cmd/naeos

      - name: Generate checksums
        run: |
          sha256sum naeos-linux-amd64 naeos-linux-arm64 naeos-darwin-amd64 naeos-darwin-arm64 naeos-windows-amd64.exe > checksums.txt

      - name: Generate and verify SBOM
        run: |
          go run ./cmd/naeos/ sbom generate \
            --modules \
            --project NAEOS \
            --version "${{ steps.version.outputs.VERSION }}" \
            --output "naeos_${{ steps.version.outputs.VERSION }}.bom.json"
          go run ./cmd/naeos/ sbom verify "naeos_${{ steps.version.outputs.VERSION }}.bom.json"

      - name: Package tar.gz archives (installer format)
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          for pair in "linux-amd64:linux:amd64" "linux-arm64:linux:arm64" "darwin-amd64:darwin:amd64" "darwin-arm64:darwin:arm64"; do
            bin="${pair%%:*}"; rest="${pair#*:}"; os="${rest%%:*}"; arch="${rest#*:}"
            mkdir -p "arch/$bin"
            cp "naeos-$bin" "arch/$bin/naeos"
            cp LICENSE README.md CHANGELOG.md "arch/$bin/"
            cp "naeos_${VERSION}.bom.json" "arch/$bin/"
            tar -C "arch/$bin" -czf "naeos_${VERSION}_${os}_${arch}.tar.gz" LICENSE README.md CHANGELOG.md "naeos_${VERSION}.bom.json" naeos
          done

      - name: Prepare release notes
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          TAG="${GITHUB_REF#refs/tags/}"
          {
            printf '## NAEOS %s\n\n' "$VERSION"
            printf 'Declarative platform engineering system — transform specifications into validated, multi-language project structures.\n\n'
            printf '### Installation\n\n```bash\ncurl -fsSL https://naeos.dev/install.sh | sh\n```\n\nOr with Go:\n\n```bash\ngo install github.com/NAEOS-foundation/naeos/cmd/naeos@%s\n```\n\n' "$TAG"
            printf '### Binary Downloads\n\n'
            printf '| Platform | Architecture | Archive |\n|----------|-------------|---------|\n'
            printf '| Linux | amd64 | `naeos_%s_linux_amd64.tar.gz` |\n' "$VERSION"
            printf '| Linux | arm64 | `naeos_%s_linux_arm64.tar.gz` |\n' "$VERSION"
            printf '| macOS | amd64 | `naeos_%s_darwin_amd64.tar.gz` |\n' "$VERSION"
            printf '| macOS | arm64 | `naeos_%s_darwin_arm64.tar.gz` |\n' "$VERSION"
            printf '| Windows | amd64 | `naeos-windows-amd64.exe` |\n\n'
            printf '### What\x27s New in %s\n\n' "$VERSION"
            awk -v "v=${VERSION}" 'BEGIN{f=0} $0 ~ "^## \\[" v "\\]"{f=1; next} f && /^## \[/{exit} f' CHANGELOG.md \
              | grep -v '^\- \*\*Version bump'
          } > /tmp/release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@e598afbe1493e6b1bafb1f389cabb956eab91231
        with:
          name: NAEOS ${{ steps.version.outputs.VERSION }}
          body_path: /tmp/release-notes.md
          files: |
            naeos-linux-amd64
            naeos-linux-arm64
            naeos-darwin-amd64
            naeos-darwin-arm64
            naeos-windows-amd64.exe
            naeos_${{ steps.version.outputs.VERSION }}_linux_amd64.tar.gz
            naeos_${{ steps.version.outputs.VERSION }}_linux_arm64.tar.gz
            naeos_${{ steps.version.outputs.VERSION }}_darwin_amd64.tar.gz
            naeos_${{ steps.version.outputs.VERSION }}_darwin_arm64.tar.gz
            naeos_${{ steps.version.outputs.VERSION }}.bom.json
            checksums.txt
          draft: false
          prerelease: false

      - name: Generate release blog posts
        id: blog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          TAG="${GITHUB_REF#refs/tags/}"
          DATE=$(date +%Y-%m-%d)
          gh release view "$TAG" --json body -q .body > /tmp/release-body.md
          CHANGED=false
          if [ ! -f "site/content/blog/${TAG}-release.md" ]; then
            printf -- '---\ntitle: "NAEOS %s Release"\ndate: %s\ndescription: "Release notes for NAEOS %s — new features, improvements, and bug fixes."\ncategories: ["release"]\n---\n' \
              "$VERSION" "$DATE" "$VERSION" > "site/content/blog/${TAG}-release.md"
            cat /tmp/release-body.md >> "site/content/blog/${TAG}-release.md"
            CHANGED=true
          fi
          mkdir -p site/content/id/blog
          if [ ! -f "site/content/id/blog/${TAG}-release.md" ]; then
            printf -- '---\ntitle: "Rilis NAEOS %s"\ndate: %s\ndescription: "Catatan rilis untuk NAEOS %s — fitur baru, perbaikan, dan perbaikan bug."\ncategories: ["release"]\n---\n' \
              "$VERSION" "$DATE" "$VERSION" > "site/content/id/blog/${TAG}-release.md"
            cat /tmp/release-body.md >> "site/content/id/blog/${TAG}-release.md"
            CHANGED=true
          fi
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Create release blog post PR
        if: steps.blog.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c
        with:
          token: ${{ github.token }}
          commit-message: "blog: add ${{ github.ref_name }} release post"
          title: "Blog: Add ${{ github.ref_name }} release post"
          body: |
            Auto-generated blog post for the ${{ github.ref_name }} release.
            
            Changes:
            - Added English blog post (if missing)
            - Added Indonesian blog post (if missing)
          branch: blog/${{ github.ref_name }}
          delete-branch: true
