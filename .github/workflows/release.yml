name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build linux/amd64
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          go build -ldflags="-s -w -X github.com/NAEOS-foundation/naeos/internal/version.Version=${{ steps.version.outputs.VERSION }} -X github.com/NAEOS-foundation/naeos/internal/version.GitCommit=${{ github.sha }}" \
            -o naeos-linux-amd64 ./cmd/naeos

      - name: Build linux/arm64
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: |
          go build -ldflags="-s -w -X github.com/NAEOS-foundation/naeos/internal/version.Version=${{ steps.version.outputs.VERSION }} -X github.com/NAEOS-foundation/naeos/internal/version.GitCommit=${{ github.sha }}" \
            -o naeos-linux-arm64 ./cmd/naeos

      - name: Build darwin/amd64
        env:
          GOOS: darwin
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          go build -ldflags="-s -w -X github.com/NAEOS-foundation/naeos/internal/version.Version=${{ steps.version.outputs.VERSION }} -X github.com/NAEOS-foundation/naeos/internal/version.GitCommit=${{ github.sha }}" \
            -o naeos-darwin-amd64 ./cmd/naeos

      - name: Build darwin/arm64
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: |
          go build -ldflags="-s -w -X github.com/NAEOS-foundation/naeos/internal/version.Version=${{ steps.version.outputs.VERSION }} -X github.com/NAEOS-foundation/naeos/internal/version.GitCommit=${{ github.sha }}" \
            -o naeos-darwin-arm64 ./cmd/naeos

      - name: Build windows/amd64
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          go build -ldflags="-s -w -X github.com/NAEOS-foundation/naeos/internal/version.Version=${{ steps.version.outputs.VERSION }} -X github.com/NAEOS-foundation/naeos/internal/version.GitCommit=${{ github.sha }}" \
            -o naeos-windows-amd64.exe ./cmd/naeos

      - name: Generate checksums
        run: |
          sha256sum naeos-linux-amd64 naeos-linux-arm64 naeos-darwin-amd64 naeos-darwin-arm64 naeos-windows-amd64.exe > checksums.txt

      - name: Package tar.gz archives (installer format)
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          for pair in "linux-amd64:linux:amd64" "linux-arm64:linux:arm64" "darwin-amd64:darwin:amd64" "darwin-arm64:darwin:arm64"; do
            bin="${pair%%:*}"; rest="${pair#*:}"; os="${rest%%:*}"; arch="${rest#*:}"
            mkdir -p "arch/$bin"
            cp "naeos-$bin" "arch/$bin/naeos"
            cp LICENSE README.md CHANGELOG.md "arch/$bin/"
            tar -C "arch/$bin" -czf "naeos_${VERSION}_${os}_${arch}.tar.gz" LICENSE README.md CHANGELOG.md naeos
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: NAEOS ${{ steps.version.outputs.VERSION }}
          body: |
            ## NAEOS ${{ steps.version.outputs.VERSION }}

            Declarative platform engineering system — transform specifications into validated, multi-language project structures.

            ### Installation

            ```bash
            curl -fsSL https://naeos.dev/install.sh | sh
            ```

            Or with Go:

            ```bash
            go install github.com/NAEOS-foundation/naeos/cmd/naeos@${{ github.ref_name }}
            ```

            ### Binary Downloads

            | Platform | Architecture | Archive |
            |----------|-------------|---------|
            | Linux | amd64 | `naeos_${{ steps.version.outputs.VERSION }}_linux_amd64.tar.gz` |
            | Linux | arm64 | `naeos_${{ steps.version.outputs.VERSION }}_linux_arm64.tar.gz` |
            | macOS | amd64 | `naeos_${{ steps.version.outputs.VERSION }}_darwin_amd64.tar.gz` |
            | macOS | arm64 | `naeos_${{ steps.version.outputs.VERSION }}_darwin_arm64.tar.gz` |
            | Windows | amd64 | `naeos-windows-amd64.exe` |

            ### What's New in v3.1.0

            - **Pipeline caching** — `naeos run --cache-dir <dir>` caches intermediate stage results; rebuilds reuse cached output for faster iteration
            - **Pipeline profiling on `naeos run`** — `--profile`/`--profile-out` capture per-stage timing, `--pprof` exposes a pprof HTTP server for live heap/CPU inspection
            - **Architecture patterns** — monolithic, microservices, and serverless patterns in the NEIR model
            - **WASM plugin hardening** — plugin host requires exported metadata symbols; expanded WASM sandbox support
          files: |
            naeos-linux-amd64
            naeos-linux-arm64
            naeos-darwin-amd64
            naeos-darwin-arm64
            naeos-windows-amd64.exe
            naeos_${{ steps.version.outputs.VERSION }}_linux_amd64.tar.gz
            naeos_${{ steps.version.outputs.VERSION }}_linux_arm64.tar.gz
            naeos_${{ steps.version.outputs.VERSION }}_darwin_amd64.tar.gz
            naeos_${{ steps.version.outputs.VERSION }}_darwin_arm64.tar.gz
            checksums.txt
          draft: false
          prerelease: false
