name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build linux/amd64
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          go build -ldflags="-s -w -X github.com/NAEOS-foundation/naeos/internal/version.Version=${{ steps.version.outputs.VERSION }} -X github.com/NAEOS-foundation/naeos/internal/version.GitCommit=${{ github.sha }}" \
            -o naeos-linux-amd64 ./cmd/naeos

      - name: Build linux/arm64
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: |
          go build -ldflags="-s -w -X github.com/NAEOS-foundation/naeos/internal/version.Version=${{ steps.version.outputs.VERSION }} -X github.com/NAEOS-foundation/naeos/internal/version.GitCommit=${{ github.sha }}" \
            -o naeos-linux-arm64 ./cmd/naeos

      - name: Build darwin/amd64
        env:
          GOOS: darwin
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          go build -ldflags="-s -w -X github.com/NAEOS-foundation/naeos/internal/version.Version=${{ steps.version.outputs.VERSION }} -X github.com/NAEOS-foundation/naeos/internal/version.GitCommit=${{ github.sha }}" \
            -o naeos-darwin-amd64 ./cmd/naeos

      - name: Build darwin/arm64
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: |
          go build -ldflags="-s -w -X github.com/NAEOS-foundation/naeos/internal/version.Version=${{ steps.version.outputs.VERSION }} -X github.com/NAEOS-foundation/naeos/internal/version.GitCommit=${{ github.sha }}" \
            -o naeos-darwin-arm64 ./cmd/naeos

      - name: Build windows/amd64
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          go build -ldflags="-s -w -X github.com/NAEOS-foundation/naeos/internal/version.Version=${{ steps.version.outputs.VERSION }} -X github.com/NAEOS-foundation/naeos/internal/version.GitCommit=${{ github.sha }}" \
            -o naeos-windows-amd64.exe ./cmd/naeos

      - name: Generate checksums
        run: |
          sha256sum naeos-linux-amd64 naeos-linux-arm64 naeos-darwin-amd64 naeos-darwin-arm64 naeos-windows-amd64.exe > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: NAEOS ${{ steps.version.outputs.VERSION }}
          body: |
            ## NAEOS ${{ steps.version.outputs.VERSION }}

            Declarative platform engineering system — transform specifications into validated, multi-language project structures.

            ### Installation

            ```bash
            go install github.com/NAEOS-foundation/naeos/cmd/naeos@${{ github.ref_name }}
            ```

            ### Binary Downloads

            | Platform | Architecture | Binary |
            |----------|-------------|--------|
            | Linux | amd64 | `naeos-linux-amd64` |
            | Linux | arm64 | `naeos-linux-arm64` |
            | macOS | amd64 | `naeos-darwin-amd64` |
            | macOS | arm64 | `naeos-darwin-arm64` |
            | Windows | amd64 | `naeos-windows-amd64.exe` |

            ### What's New in v3.0.0

            - **NEIR v2.0 specification** — conditional modules (`Condition` + `ConditionalResolver`), environment profiles (`ActiveProfile`/`Inherits` + `ProfileResolver`), `$if{}/$endif` directives
            - **Enterprise auth** — OAuth2/OIDC provider, SSO (OIDC, SAML 2.0, LDAP with BER parsing), RBAC with hierarchy + deny rules, 4 compliance role templates
            - **Compliance suite** — SOC2/HIPAA/GDPR frameworks, audit hashed-chain + AES-256-GCM encrypted auditors, cloud export (AWS SigV4, GCS HMAC, Azure SharedKey), `naeos compliance report/verify/cloud-export`
            - **Supabase backend integration** — DB adapter, Auth (GoTrue), Storage, Edge Functions, Admin API, CLI `naeos supabase` group
            - **NEIR-aware LSP server** — autocomplete, diagnostics, hover, go-to-definition, code actions
            - **VS Code extension generator** — `naeos dx vscode-gen` with TextMate grammar + LSP client
            - **Pipeline performance** — parallel `CompileAll` (3× speedup), stage caching, lazy NEIR loading, `--profile`/`--memprofile` profiling
            - **Distributed builds** — `naeos build --distributed --workers N` runs real pipelines per module
            - **NEIR diff visualization** — `naeos diff --visual` side-by-side tree view
            - **Plugin ecosystem** — official plugin registry on GitHub Pages, example plugins (hello/spec-lint/artifact-stats), WASM sandbox support
            - **TUI live dashboard** — `naeos dashboard` with WebSocket live updates
            - **Test coverage 86.9% overall** — 13 target packages ≥80% (websocket 95.8%, configschema 94.7%, auth 92.5%)
          files: |
            naeos-linux-amd64
            naeos-linux-arm64
            naeos-darwin-amd64
            naeos-darwin-arm64
            naeos-windows-amd64.exe
            checksums.txt
          draft: false
          prerelease: false
