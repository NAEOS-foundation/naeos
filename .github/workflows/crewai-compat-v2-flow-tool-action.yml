name: CrewAI Compatibility v2 — Flow ToolAction Runtime Probe

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/crewai_compat_v2_harness.py"
      - "tests/test_crewai_flow_tool_action_runtime.py"
      - ".github/workflows/crewai-compat-v2-flow-tool-action.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flow-tool-action:
    name: Flow ToolAction probe — CrewAI ${{ matrix.crewai-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crewai-version: ["1.15.16", "1.15.44"]
    steps:
      - name: Checkout NAEOS
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Install pinned CrewAI runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install "crewai==${{ matrix.crewai-version }}"

      - name: Record exact runtime
        run: |
          python --version
          python -c "import crewai; print('crewai', crewai.__version__)"

      - name: Run Flow ToolAction evidence probe
        id: probe
        run: |
          set +e
          python tests/test_crewai_flow_tool_action_runtime.py \
            --output "external-validation-evidence/flow-tool-action-${{ matrix.crewai-version }}.json"
          rc=$?
          set -e
          if [ "$rc" -eq 2 ]; then
            echo "compatibility=FAIL" >> "$GITHUB_OUTPUT"
            echo "::warning::Flow ToolAction DENY bypass observed; see evidence artifact."
            exit 0
          elif [ "$rc" -eq 0 ]; then
            echo "compatibility=PASS" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Probe crashed or produced invalid evidence (exit $rc)."
            exit "$rc"
          fi

      - name: Validate probe evidence schema
        run: |
          python -m unittest tests.test_crewai_flow_tool_action_runtime -v

      - name: Upload Flow ToolAction evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: crewai-v2-flow-tool-action-${{ matrix.crewai-version }}-${{ github.sha }}
          path: external-validation-evidence/
          if-no-files-found: warn
          retention-days: 30
