name: External Validation — CrewAI + Attenu

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/external-validation-crewai.yml'
      - 'docs/EXTERNAL-VALIDATION.md'
      - 'experiments/aip-execution-evidence/**'
      - 'experiments/sandbase-policy-freshness/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crewai-attenu-runtime:
    name: CrewAI + Attenu runtime evidence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NAEOS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Capture evaluation metadata
        run: |
          set -euo pipefail
          mkdir -p external-validation-evidence
          printf '{"naeos_commit":"%s","workflow_run":"%s","started_utc":"%s"}\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > external-validation-evidence/metadata.json

      - name: Checkout Attenu source at recorded revision
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/attenu-io/attenu-guard.git /tmp/attenu-guard
          cd /tmp/attenu-guard
          git rev-parse HEAD > "$GITHUB_WORKSPACE/external-validation-evidence/attenu_commit.txt"
          printf 'attenu_commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_WORKSPACE/external-validation-evidence/metadata.txt"

      - name: Install pinned runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e /tmp/attenu-guard
          python -m pip install 'crewai==1.15.16' 'cryptography'

      - name: Record runtime versions
        run: |
          set -euo pipefail
          {
            python --version
            python -m pip show attenu-guard crewai cryptography
          } > external-validation-evidence/runtime-versions.txt

      - name: Run upstream CrewAI enforcement demo
        working-directory: /tmp/attenu-guard
        run: |
          set -o pipefail
          set +e
          python examples/integrations/crewai/demo.py 2>&1 | tee "$GITHUB_WORKSPACE/external-validation-evidence/crewai-attenu-demo.log"
          rc=${PIPESTATUS[0]}
          set -e
          printf '{"exit_code":%s,"completed_utc":"%s"}\n' "$rc" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > "$GITHUB_WORKSPACE/external-validation-evidence/result.json"
          exit "$rc"

      - name: Preserve raw evidence bundle
        if: always()
        run: |
          set -euo pipefail
          find /tmp/attenu-guard -type f \( -name 'evidence-bundle.json' -o -name 'log.jsonl' \) \
            -exec cp --parents {} external-validation-evidence/ \; 2>/dev/null || true
          {
            echo "NAEOS commit: $GITHUB_SHA"
            echo "Attenu commit: $(cat external-validation-evidence/attenu_commit.txt)"
            echo "CrewAI: 1.15.16"
            echo "Python: 3.12"
            echo
            echo "Interpretation:"
            echo "- This workflow executes Attenu/CrewAI runtime evidence independently of NAEOS fixtures."
            echo "- PASS here means the external runtime scenario reproduced successfully."
            echo "- It does not prove NAEOS production readiness or transfer Attenu evidence into NAEOS evidence."
          } > external-validation-evidence/validation-record.txt

      - name: Upload external validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-validation-crewai-attenu-${{ github.sha }}
          path: external-validation-evidence/
          if-no-files-found: error
          retention-days: 30
