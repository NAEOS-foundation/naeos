name: Handoff Digest Cross-Language Vectors

on:
  pull_request:
    paths:
      - "tests/interop/**"
      - ".github/workflows/handoff-digest-python.yml"
  push:
    branches:
      - "spec/handoff-canonicalization-v1-clean"
    paths:
      - "tests/interop/**"
      - ".github/workflows/handoff-digest-python.yml"

permissions:
  contents: read

jobs:
  python-jcs-vectors:
    name: Independent Python RFC 8785 vectors
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install independent JCS implementation
        run: python -m pip install --disable-pip-version-check rfc8785==0.1.4

      - name: Verify candidate digest golden vectors
        run: python tests/interop/candidate_digest_v1_python.py
