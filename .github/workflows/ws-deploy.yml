name: WebSocket Worker

on:
  push:
    branches: [main]
    paths:
      - 'infra/ws-worker/**'
      - '.github/workflows/ws-deploy.yml'
  workflow_dispatch:

concurrency:
  group: ws-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: infra/ws-worker
        run: npm install
      - name: Typecheck
        working-directory: infra/ws-worker
        run: npm run typecheck
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: infra/ws-worker
          command: deploy