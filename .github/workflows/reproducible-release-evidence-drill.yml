name: Reproducible Release Evidence Drill

on:
  pull_request:
    paths:
      - "scripts/check-release-dco.sh"
      - "scripts/generate-legal-evidence.sh"
      - "scripts/validate-legal-evidence.sh"
      - "scripts/release-legal-gate.sh"
      - "scripts/test-reproducible-release-evidence.sh"
      - ".github/workflows/reproducible-release-evidence-drill.yml"
      - ".github/workflows/release.yml"
      - "legal/evidence/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproducible-release-evidence:
    name: Reproducible release evidence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Run isolated reproducibility drill
        run: bash scripts/test-reproducible-release-evidence.sh
